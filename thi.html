<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phòng Thi Trắc Nghiệm - PVK</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header style="background: #e74c3c; padding: 15px; display: flex; justify-content: space-between; align-items: center; color: white;">
        <h3 id="tieu-de-phong-thi" style="margin: 0;">Phòng Thi Trắc Nghiệm</h3>
        <div>
            <button id="nut-quay-lai" style="padding: 8px 15px; cursor: pointer;">Quay Lại Danh Sách</button>
            <button onclick="location.href='home.html'" style="padding: 8px 15px; cursor: pointer;">Trang Chủ</button>
        </div>
    </header>

    <div style="display: flex; justify-content: center; padding: 20px;">
        <div style="background: white; width: 100%; max-width: 800px; padding: 30px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1);">
            
            <h2 id="ten-de-thi" style="color: #2c3e50; text-align: center; margin-bottom: 25px;">Đang tải nội dung đề...</h2>
            
            <div id="khung-chua-cau-hoi">
                <!-- Nội dung câu hỏi từ lúc bạn thêm đề sẽ hiện ở đây -->
            </div>

        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const mon = urlParams.get('mon') || 'toan';
        const idDe = urlParams.get('id');

        // Nút quay lại đúng danh sách môn
        document.getElementById('nut-quay-lai').onclick = function() {
            location.href = `danhsachde.html?mon=${mon}`;
        };

        // Tìm đề trong bộ nhớ
        const danhSachDe = JSON.parse(localStorage.getItem('kho_de_thi')) || { toan: [], ly: [], tin: [] };
        const deCuaMon = danhSachDe[mon] || [];
        const deHienTai = deCuaMon.find(d => d.id == idDe);

        if (deHienTai) {
            document.getElementById('tieu-de-phong-thi').innerText = "Phòng Thi - " + deHienTai.ten;
            document.getElementById('ten-de-thi').innerText = deHienTai.ten;
            document.getElementById('khung-chua-cau-hoi').innerHTML = deHienTai.htmlContent;
        } else {
            document.getElementById('khung-chua-cau-hoi').innerHTML = `<p style="text-align: center; color: red; font-size: 18px;">Không tìm thấy nội dung đề thi này! Vui lòng chọn lại đề ở sảnh.</p>`;
        }
    </script>
</body>
</html>
