</head>

    <!-- Khung hộp màu trắng ở giữa màn hình -->
    <div class="hop-dang-nhap">
        
        <h2 class="tieu-de-form">Hệ Thống Luyện Đề</h2>

        <!-- Nhóm 2 nút chuyển đổi Đăng nhập / Đăng ký -->
        <div class="nhom-tab">
            <button class="tab-btn active">Đăng Nhập</button>
            <button class="tab-btn">Đăng Ký Mới</button>
        </div>

        <!-- Các ô nhập thông tin -->
        <div class="form-group">
            <label>Tên đăng nhập</label>
            <input type="text" placeholder="Nhập tài khoản...">
        </div>

        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" placeholder="abcd...">
        </div>

        <!-- Ô nhập mã đăng ký độc quyền từ Admin -->
        <div class="form-group">
            <label>Mã kích hoạt (Admin cấp)</label>
            <input type="text" placeholder="Ví dụ: PVK-0303A...">
        </div>

        <!-- Nút bấm chính -->
        <button class="nut-xac-nhan">Đăng Nhập</button>

        <!-- Dòng chữ báo lỗi màu đỏ giống ảnh mẫu -->
        <p class="bao-loi">Nhập rồi vào</p>

    </div>

</body>
</html>
